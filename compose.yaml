services:
  postgres:
    image: postgres:18-alpine
    container_name: aws-infra-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: aws-infra-api
    restart: unless-stopped

    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://appuser:${POSTGRES_PASSWORD}@postgres:5432/appdb

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: